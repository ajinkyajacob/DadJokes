   <div class="h-[100vh] w-full flex flex-col justify-center align-baseline gap-40 bg-stone-800">
     <div
        class="text-center font-extrabold text-4xl w-2/5 sm:w-4/5 self-center text-yellow-100"
      >
        {{ joke().joke }}
      </div>
      <section class="flex justify-around ">
        <span>
          <button #likeBtn mat-fab extended (mousedown)="onLike.emit()">
                <mat-icon>thumb_up</mat-icon>
                Like {{joke().like}}
              </button>
  
        </span>
        <span>
  
          <button #refreshBtn mat-fab extended  (mousedown)="onRefresh.emit()">
                New Joke
              </button>
  
        </span>
        <span>
        <button #dislikeBtn mat-fab extended (mousedown)="onDislike.emit()" >
                <mat-icon>thumb_down</mat-icon>
                Dislike {{joke().dislike}}
              </button>
        </span>
  
      </section>

   </div>
