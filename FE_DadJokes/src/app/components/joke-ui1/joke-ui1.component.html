    <div
      class="text-center font-extrabold text-4xl w-2/5 sm:w-4/5 self-center text-pastelYellow"
    >
      {{ joke().joke }}
    </div>
    <section class="flex justify-around ">
      <span>
        <button #likeBtn mat-fab extended (click)="onLike.emit()">
              <mat-icon>thumb_up</mat-icon>
              Like {{joke().like}}
            </button>

      </span>
      <span>

        <button #refreshBtn mat-fab extended  (click)="onRefresh.emit()">
              New Joke
            </button>

      </span>
      <span>
      <button #dislikeBtn mat-fab extended (click)="onDislike.emit()" >
              <mat-icon>thumb_down</mat-icon>
              Dislike {{joke().dislike}}
            </button>
      </span>

    </section>
